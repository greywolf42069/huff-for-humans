name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Compile Huff + Foundry tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Huff (huffc 0.3.2)
        run: |
          mkdir -p "$HOME/.huff/bin"
          # Pull the compiler binary straight from the GitHub release rather than
          # get.huff.sh, which intermittently returns an empty reply on CI.
          curl -fsSL -o /tmp/huff.tar.gz \
            https://github.com/huff-language/huff-rs/releases/download/nightly/huff_nightly_linux_amd64.tar.gz
          tar -xzf /tmp/huff.tar.gz -C "$HOME/.huff/bin"
          chmod +x "$HOME/.huff/bin/huffc"
          echo "$HOME/.huff/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          forge --version
          huffc --version

      - name: Verify committed bytecode matches Huff source
        run: make verify-bytecode

      - name: Run test suite
        run: forge test -vvv
